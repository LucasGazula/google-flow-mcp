# Push na main: testa no GitHub e, se passar, publica na Banana Pi (runner self-hosted na própria Pi,
# porque os runners do GitHub não alcançam a rede local).
name: Deploy Banana Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv run --locked python -m unittest
      - name: Nomes indefinidos (pyflakes)
        # Os testes usam mocks; um NameError num caminho pouco exercitado só apareceria em produção.
        run: "! uvx pyflakes==3.2.0 *.py deploy/*.py | grep -E 'undefined name|referenced before assignment'"

  deploy:
    needs: test
    runs-on: [self-hosted, banana-pi]
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar app e dependências
        run: |
          source /mnt/ssd/flow-mcp/env.sh
          # --delete só remove código antigo. Pastas de execução são protegidas (rsync não apaga excluídos):
          # sem FLOW_MCP_OUTPUT, os downloads ficam em app/downloads e sumiriam a cada deploy.
          rsync -a --delete --exclude .git --exclude .github --exclude __pycache__ \
            --exclude /downloads --exclude /profiles --exclude /exports --exclude /logs \
            --exclude /keepalive.log --exclude /keepalive-state.json ./ "$HOME_FLOW/app/"
          cd "$HOME_FLOW/app" && uv sync --locked
      - name: Conferir importação do servidor
        run: |
          source /mnt/ssd/flow-mcp/env.sh
          cd "$HOME_FLOW/app" && uv run --locked python -c "import flow_mcp" && git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD > "$HOME_FLOW/app/.deployed"
      - name: Reiniciar o MCP HTTP
        run: |
          sudo -n systemctl restart flow-mcp
          sleep 10 && systemctl is-active flow-mcp
          # Servidor no ar de fato: sem token, /mcp responde 401 (crash em loop não responde).
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/mcp || true)
            [ "$code" = 401 ] && exit 0
            sleep 5
          done
          echo "flow-mcp não respondeu em /mcp (último código: $code)"; exit 1
